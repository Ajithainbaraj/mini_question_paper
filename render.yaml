services:
  - type: web
    name: eduai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 300 --workers 1 --log-level debug
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: TRANSFORMERS_CACHE
        value: /tmp/transformers_cache
      - key: HF_HOME
        value: /tmp/hf_home
      - key: SENTENCE_TRANSFORMERS_HOME
        value: /tmp/sentence_transformers
      - key: PYTHON_VERSION
        value: 3.11.9
