<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EduAI – {% block title %}{% endblock %}</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --primary-bg: #eef2ff;
      --success: #22c55e;
      --bg: #f8fafc;
      --white: #ffffff;
      --text: #0f172a;
      --text2: #475569;
      --text3: #94a3b8;
      --border: #e2e8f0;
      --shadow-sm: 0 1px 4px rgba(15,23,42,0.06);
      --shadow: 0 4px 16px rgba(15,23,42,0.08);
      --radius: 14px;
      --radius-sm: 10px;
      --transition: all 0.22s ease;
    }

    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .fp-nav {
      background: var(--white);
      border-bottom: 1px solid var(--border);
      height: 60px;
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--shadow-sm);
    }

    .fp-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .fp-brand-icon {
      width: 34px; height: 34px;
      background: linear-gradient(135deg, var(--primary), #8b5cf6);
      border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
    }

    .fp-brand-name {
      font-size: 16px;
      font-weight: 800;
      color: var(--text);
    }

    .fp-divider {
      width: 1px; height: 20px;
      background: var(--border);
      margin: 0 12px;
    }

    .fp-label {
      font-size: 14px;
      font-weight: 600;
      color: var(--text2);
    }

    .fp-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text2);
      text-decoration: none;
      transition: var(--transition);
    }

    .fp-back:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--primary-bg);
    }

    .fp-content {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 24px;
    }

    .card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 20px;
    }

    .card-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 22px;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      text-decoration: none;
      font-family: inherit;
    }

    .btn:hover { transform: translateY(-1px); }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-secondary {
      background: var(--bg);
      color: var(--text);
      border: 1.5px solid var(--border);
    }
    .btn-secondary:hover { border-color: var(--primary); color: var(--primary); }

    .btn-success {
      background: var(--success);
      color: white;
    }

    .output-box {
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-left: 4px solid var(--primary);
      border-radius: var(--radius-sm);
      padding: 20px;
      font-size: 14px;
      line-height: 1.8;
      color: var(--text);
      white-space: pre-wrap;
      font-family: 'Inter', monospace;
    }

    .alert {
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .alert-error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #dc2626;
    }
  </style>
</head>
<body>

<nav class="fp-nav">
  <div style="display:flex;align-items:center;">
    <a href="/" class="fp-brand">
      <div class="fp-brand-icon">🎓</div>
      <div class="fp-brand-name">EduAI</div>
    </a>
    <div class="fp-divider"></div>
    <div class="fp-label">{% block page_label %}Result{% endblock %}</div>
  </div>
  <a href="/" class="fp-back">
    <i class="fas fa-arrow-left"></i> Dashboard
  </a>
</nav>

<div class="fp-content">
  {% block content %}{% endblock %}
</div>

</body>
</html>
