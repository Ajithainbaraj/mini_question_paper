<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EduAI – Create Account</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    :root {
      --primary: #6366f1; --primary-dark: #4f46e5;
      --primary-bg: #eef2ff;
      --success: #22c55e;
      --bg: #f8fafc; --white: #ffffff;
      --text: #0f172a; --text2: #475569; --text3: #94a3b8;
      --border: #e2e8f0;
      --radius: 14px; --radius-sm: 10px;
    }
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }

    .auth-card {
      width: 100%;
      max-width: 460px;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 44px 40px;
      box-shadow: 0 20px 60px rgba(15,23,42,0.1);
    }

    .brand-row {
      display: flex; align-items: center; gap: 10px;
      justify-content: center; margin-bottom: 28px;
    }

    .brand-icon {
      width: 40px; height: 40px;
      background: linear-gradient(135deg, var(--primary), #8b5cf6);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }

    .brand-name { font-size: 20px; font-weight: 800; color: var(--text); }

    h2 {
      font-size: 22px; font-weight: 800; color: var(--text);
      text-align: center; margin-bottom: 4px;
    }

    .subtitle {
      font-size: 13px; color: var(--text3);
      text-align: center; margin-bottom: 28px;
    }

    .form-group { margin-bottom: 16px; }

    .form-group label {
      display: block; font-size: 12px; font-weight: 600;
      color: var(--text2); margin-bottom: 6px;
      text-transform: uppercase; letter-spacing: 0.5px;
    }

    .input-wrap { position: relative; }

    .input-wrap input {
      width: 100%; padding: 11px 14px 11px 40px;
      background: var(--bg); border: 1.5px solid var(--border);
      border-radius: var(--radius-sm); font-size: 14px;
      color: var(--text); outline: none; transition: all 0.2s;
      font-family: inherit;
    }

    .input-wrap input:focus {
      border-color: var(--primary); background: var(--white);
      box-shadow: 0 0 0 3px rgba(99,102,241,0.1);
    }

    .input-wrap i {
      position: absolute; left: 13px; top: 50%;
      transform: translateY(-50%); color: var(--text3); font-size: 14px;
    }

    .btn-register {
      width: 100%; padding: 13px;
      background: var(--primary); color: white; border: none;
      border-radius: var(--radius-sm); font-size: 15px; font-weight: 700;
      cursor: pointer; transition: all 0.2s; font-family: inherit;
      margin-top: 8px;
    }

    .btn-register:hover {
      background: var(--primary-dark); transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(99,102,241,0.35);
    }

    .alert {
      padding: 11px 14px; border-radius: var(--radius-sm);
      margin-bottom: 18px; font-size: 13px;
      display: flex; align-items: center; gap: 8px;
    }

    .alert-error { background: #fef2f2; border: 1px solid #fecaca; color: #dc2626; }

    .login-link {
      text-align: center; font-size: 13px; color: var(--text3);
      margin-top: 20px;
    }

    .login-link a { color: var(--primary); font-weight: 600; text-decoration: none; }
    .login-link a:hover { color: var(--primary-dark); }

    @media(max-width: 480px) {
      .auth-card { padding: 32px 24px; }
    }
  </style>
</head>
<body>

<div class="auth-card">
  <div class="brand-row">
    <div class="brand-icon">🎓</div>
    <div class="brand-name">EduAI</div>
  </div>

  <h2>Create your account ✨</h2>
  <p class="subtitle">Join thousands of students learning smarter</p>

  {% if error %}
  <div class="alert alert-error"><i class="fas fa-exclamation-circle"></i> {{ error }}</div>
  {% endif %}

  <form method="POST" action="/register">
    <div class="form-group">
      <label>Full Name</label>
      <div class="input-wrap">
        <i class="fas fa-user"></i>
        <input type="text" name="fullname" placeholder="Your full name" required/>
      </div>
    </div>

    <div class="form-group">
      <label>Username</label>
      <div class="input-wrap">
        <i class="fas fa-at"></i>
        <input type="text" name="username" placeholder="Choose a username" required/>
      </div>
    </div>

    <div class="form-group">
      <label>Password</label>
      <div class="input-wrap">
        <i class="fas fa-lock"></i>
        <input type="password" name="password" placeholder="At least 6 characters" required/>
      </div>
    </div>

    <div class="form-group">
      <label>Confirm Password</label>
      <div class="input-wrap">
        <i class="fas fa-lock"></i>
        <input type="password" name="confirm_password" placeholder="Repeat your password" required/>
      </div>
    </div>

    <button type="submit" class="btn-register">
      <i class="fas fa-rocket"></i> Create Account
    </button>
  </form>

  <div class="login-link">
    Already have an account? <a href="/login">Sign in →</a>
  </div>
</div>

</body>
</html>
